name = "workspace-snapshot"
description = "List files and print the current time — no LLM."

[[steps]]
name = "files"
tool = "list_files"
path = "."
pattern = "*.py"

[[steps]]
name = "clock"
tool = "get_datetime"
timezone_name = "UTC"

[[steps]]
name = "math"
tool = "calculator"
expression = "2+2"
