[project]
name = "grok-local-agent-kit"
version = "0.3.0"
description = "Open-source toolkit for local AI agents with Ollama, MCP, tools, and autonomous capabilities. Built for 10k stars!"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.3.0",
    "duckduckgo-search",
    "click",
]

[project.scripts]
grok-agent = "grok_local_agent_kit.cli:cli"

[project.optional-dependencies]
dev = ["pytest", "ruff", "black"]

[tool.setuptools.packages.find]
where = ["."]