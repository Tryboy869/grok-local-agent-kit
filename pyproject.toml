[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-local-agent-kit"
version = "0.4.0"
description = "Open-source toolkit for building powerful local AI agents with Ollama, tool calling, MCP support and autonomous loops. Offline-first."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Tryboy869 & Grok"},
]
keywords = ["ai", "agents", "ollama", "local-llm", "mcp", "tool-calling", "autonomous"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ollama>=0.3.0",
    "duckduckgo-search>=6.0",
    "click>=8.0",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "black>=24.0", "mypy>=1.0"]

[project.scripts]
grok-agent = "grok_local_agent_kit.cli:cli"

[project.urls]
Homepage = "https://github.com/Tryboy869/grok-local-agent-kit"
Repository = "https://github.com/Tryboy869/grok-local-agent-kit"
Issues = "https://github.com/Tryboy869/grok-local-agent-kit/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["grok_local_agent_kit*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
