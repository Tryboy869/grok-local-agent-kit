[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-local-agent-kit"
version = "0.8.5"
description = "Open-source toolkit for building powerful local AI agents with MCP support, multi-LLM routing (Ollama, LM Studio), and real tools. Offline-first."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Nexus Studio / Tryboy869"}]
keywords = ["ai", "agents", "ollama", "lm-studio", "mcp", "local-llm", "tool-calling", "react"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ollama>=0.3.0",
    "duckduckgo-search>=6.0",
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "black>=24.0"]
mcp = []  # reserved for real MCP client extra in later 0.8.x

[project.scripts]
grok-agent = "grok_local_agent_kit.cli:cli"

[project.urls]
Homepage = "https://github.com/Tryboy869/grok-local-agent-kit"
Repository = "https://github.com/Tryboy869/grok-local-agent-kit"
Issues = "https://github.com/Tryboy869/grok-local-agent-kit/issues"
Changelog = "https://github.com/Tryboy869/grok-local-agent-kit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["grok_local_agent_kit*"]
exclude = ["src*", "tests*", "examples*"]

[tool.setuptools.package-data]
"grok_local_agent_kit" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
